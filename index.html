<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="婆婆健腦樂園">
  <title>婆婆健腦樂園 - 益智小遊戲</title>
  <style>
    :root {
      --bg-color: #F7F4EB;
      --card-bg: #FFFFFF;
      --text-main: #2C2A29;
      --primary: #C84B31;
      --primary-hover: #A33B24;
      --secondary: #2D6A4F;
      --secondary-hover: #214F3B;
      --accent: #E9C46A;
      --border-color: #D3CBB8;
      --selected-cell: #FFF3B0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 780px;
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 34px;
      color: var(--primary);
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 20px;
      color: #666;
      margin: 0 0 14px 0;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 780px;
      margin-bottom: 18px;
    }

    .tab-btn {
      flex: 1;
      padding: 16px 10px;
      font-size: 24px;
      font-weight: bold;
      border: 3px solid var(--border-color);
      border-radius: 16px;
      background: #EFE9D9;
      color: #555;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(200, 75, 49, 0.3);
    }

    .game-container {
      width: 100%;
      max-width: 780px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .game-container.active {
      display: flex;
    }

    /* 頂部進度與換組列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #E0D9C8;
      flex-wrap: wrap;
      gap: 8px;
    }

    .progress-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--secondary);
    }

    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-input {
      font-size: 20px;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      background: #FFF;
      color: #333;
      cursor: pointer;
    }

    /* 成語題目卡片 */
    .idiom-question-box {
      background: #FAF8F2;
      border: 3px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      text-align: center;
      margin-bottom: 22px;
    }

    .idiom-chars {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .char-box {
      width: 76px;
      height: 88px;
      border: 3px solid #666;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 800;
      background: #FFF;
      color: var(--text-main);
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
    }

    .char-box.blank {
      border: 3px dashed var(--primary);
      background: #FFF7F5;
      color: var(--primary);
    }

    .idiom-hint-text {
      font-size: 22px;
      color: #444;
      background: #FFF;
      padding: 12px 18px;
      border-radius: 10px;
      border: 2px dashed #E0D9C8;
      display: inline-block;
      max-width: 95%;
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 22px;
    }

    .option-btn {
      height: 84px;
      font-size: 42px;
      font-weight: bold;
      border-radius: 16px;
      border: 3px solid var(--secondary);
      background: #FFF;
      color: var(--secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      touch-action: manipulation;
    }

    .option-btn:active {
      background: var(--secondary);
      color: #FFF;
    }

    /* 6x6 簡易數獨 */
    .sudoku-board-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .sudoku-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
      border: 4px solid #222;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #222;
      gap: 2px;
    }

    .sudoku-cell {
      background: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .sudoku-cell:nth-child(3n) {
      border-right: 3px solid #222;
    }
    .sudoku-cell:nth-child(n+13):nth-child(-n+18),
    .sudoku-cell:nth-child(n+25):nth-child(-n+30) {
      border-top: 3px solid #222;
    }

    .sudoku-cell.given {
      background: #F0EDE6;
      color: #333;
    }

    .sudoku-cell.selected {
      background: var(--selected-cell) !important;
      outline: 4px solid #E29578;
      z-index: 2;
    }

    .sudoku-cell.user-filled {
      color: var(--primary);
    }

    .sudoku-keypad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
    }

    .key-btn {
      height: 72px;
      font-size: 36px;
      font-weight: bold;
      border-radius: 14px;
      border: 3px solid var(--border-color);
      background: #FFF;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .key-btn:active {
      background: var(--primary);
      color: #FFF;
    }

    .erase-btn {
      background: #FCEAE6;
      color: var(--primary);
      border-color: #EAC4BD;
      font-size: 24px;
    }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 540px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 140px;
      padding: 16px 18px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 14px;
      border: none;
      background: var(--secondary);
      color: #FFF;
      cursor: pointer;
      touch-action: manipulation;
    }

    .action-btn.alt {
      background: #5A6B7C;
    }

    .action-btn.rand {
      background: #E76F51;
    }

    /* 單題回饋彈窗 */
    .feedback-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      background: rgba(255, 255, 255, 0.98);
      border: 5px solid var(--primary);
      border-radius: 24px;
      padding: 30px 36px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      max-width: 90%;
      width: 480px;
    }

    .feedback-banner.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .feedback-title {
      font-size: 38px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .feedback-body {
      font-size: 26px;
      color: #333;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* 一組完成慶祝彈窗 (SET COMPLETION POPUP) */
    .set-popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .set-popup-overlay.show {
      display: flex;
    }

    .set-popup-card {
      background: #FFF;
      border: 6px solid #E9C46A;
      border-radius: 28px;
      padding: 36px 32px;
      text-align: center;
      max-width: 90%;
      width: 520px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.3);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .set-popup-icon {
      font-size: 64px;
      margin-bottom: 8px;
    }

    .set-popup-title {
      font-size: 38px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 14px;
    }

    .set-popup-body {
      font-size: 26px;
      color: #333;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .set-popup-btns {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .source-tag {
      font-size: 15px;
      color: #888;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌸 婆婆益智樂園 🌸</h1>
    <div class="subtitle">每日動動腦，越玩越精神！</div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('idiom')">📖 成語猜猜</button>
    <button class="tab-btn" onclick="switchTab('sudoku')">🔢 簡易數獨 (1000題)</button>
  </div>

  <!-- 成語猜猜 -->
  <div id="idiom-game" class="game-container active">
    <div class="top-bar">
      <div class="progress-title" id="idiom-progress-label">載入題目中...</div>
      <div class="select-wrapper">
        <label for="set-dropdown" style="font-size: 18px; color: #666;">換組：</label>
        <select id="set-dropdown" class="select-input" onchange="onSelectSet(this.value)"></select>
      </div>
    </div>

    <div class="idiom-question-box">
      <div class="idiom-chars" id="idiom-display"></div>
      <div class="idiom-hint-text" id="idiom-meaning">釋義載入中...</div>
    </div>

    <div class="options-grid" id="idiom-options"></div>

    <div class="controls">
      <button class="action-btn alt" onclick="prevIdiom()">⏮️ 上一題</button>
      <button class="action-btn" onclick="nextIdiom()">跳過 / 下一題 ⏭️</button>
    </div>
    <div class="source-tag">題庫來源：chinesewords.xml</div>
  </div>

  <!-- 簡易數獨 -->
  <div id="sudoku-game" class="game-container">
    <div class="top-bar">
      <div class="progress-title" id="sudoku-progress-label">第 1 / 1000 題</div>
      <div class="select-wrapper">
        <label for="sudoku-select" style="font-size: 18px; color: #666;">跳題：</label>
        <select id="sudoku-select" class="select-input" onchange="onSelectSudoku(this.value)"></select>
      </div>
    </div>
    
    <div style="font-size: 22px; color: #555; margin-bottom: 14px; text-align: center;">
      每行、每列同每個 2×3 六宮格，填入 1 至 6 數字！
    </div>
    
    <div class="sudoku-board-wrapper">
      <div class="sudoku-grid" id="sudoku-grid"></div>
      
      <div class="sudoku-keypad">
        <button class="key-btn" onclick="inputNumber(1)">1</button>
        <button class="key-btn" onclick="inputNumber(2)">2</button>
        <button class="key-btn" onclick="inputNumber(3)">3</button>
        <button class="key-btn" onclick="inputNumber(4)">4</button>
        <button class="key-btn" onclick="inputNumber(5)">5</button>
        <button class="key-btn" onclick="inputNumber(6)">6</button>
      </div>
      
      <div class="controls">
        <button class="key-btn erase-btn" style="flex: 1; min-width: 100px; height: 60px;" onclick="inputNumber(0)">擦除 ⌫</button>
        <button class="action-btn alt" style="flex: 1;" onclick="resetSudoku()">重設 🔄</button>
        <button class="action-btn" style="flex: 1.2;" onclick="checkSudoku()">完成核對 ✔️</button>
      </div>

      <div class="controls" style="margin-top: 10px;">
        <button class="action-btn alt" onclick="prevSudoku()">◀️ 上一題</button>
        <button class="action-btn rand" onclick="randomSudoku()">隨機抽一題 🎲</button>
        <button class="action-btn alt" onclick="nextSudoku()">下一題 ▶️</button>
      </div>
    </div>
    <div class="source-tag">題庫來源：sudokusource.xml</div>
  </div>

  <!-- 單題回饋彈窗 (答啱直接點「好！下一題 ➡️」前往下一題，不需多餘操作) -->
  <div class="feedback-banner" id="feedback-modal">
    <div class="feedback-title" id="fb-title">好叻呀！🎉</div>
    <div class="feedback-body" id="fb-text">婆婆答啱喇！</div>
    <button class="action-btn" style="height: 72px; font-size: 28px;" id="fb-btn" onclick="onConfirmFeedback()">
      好！做下一題 ➡️
    </button>
  </div>

  <!-- 10題整組完成慶祝彈窗 (SET POPUP) -->
  <div class="set-popup-overlay" id="set-popup">
    <div class="set-popup-card">
      <div class="set-popup-icon">🏆✨🎉</div>
      <div class="set-popup-title" id="set-popup-title">太叻喇！第 1 組完成！</div>
      <div class="set-popup-body" id="set-popup-body">
        婆婆真係好精明，呢組 10 題成語全部順利過關！每日動動腦，越玩越精神！
      </div>
      <div class="set-popup-btns">
        <button class="action-btn" style="height: 76px; font-size: 28px;" id="next-set-btn" onclick="goToNextSet()">
          挑戰下一組 (第 2 組) ➡️
        </button>
        <button class="action-btn alt" style="height: 60px; font-size: 22px;" onclick="replayCurrentSet()">
          重溫呢一組 🔄
        </button>
      </div>
    </div>
  </div>

  <script>
    /* 音效合成 (Web Audio API) */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChime(success = true) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      if (success) {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);
          gain.gain.setValueAtTime(0.18, now + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.5);
        });
      } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(330, now);
        osc.frequency.setValueAtTime(261, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    function playFanfare() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const notes = [
        { f: 392.00, t: 0.0, d: 0.18 },
        { f: 523.25, t: 0.18, d: 0.18 },
        { f: 659.25, t: 0.36, d: 0.18 },
        { f: 783.99, t: 0.54, d: 0.35 },
        { f: 1046.50, t: 0.90, d: 0.70 }
      ];
      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now + n.t);
        gain.gain.setValueAtTime(0.25, now + n.t);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d);
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));
      if (tab === 'idiom') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('idiom-game').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('sudoku-game').classList.add('active');
      }
    }

    /* ========================================================
       1. 成語猜猜模組 (載入自 chinesewords.xml)
       ======================================================== */
    let idiomSets = [];
    let currentSetIdx = 0;
    let currentIdiomInSet = 0;
    let isLastAnswerCorrect = false;

    // 內建備用題庫 (若未連伺服器或本地file://無法fetch時自動啟用)
    const fallbackIdioms = [
      [
        { chars: ['龍', '精', '虎', '猛'], blankIndex: 1, meaning: '比喻精力充沛，神采飛揚，身體健壯。', options: ['精', '心', '生', '真'] },
        { chars: ['身', '體', '健', '康'], blankIndex: 2, meaning: '祝願生活平安無病無痛，身體強健安泰。', options: ['健', '大', '樂', '安'] },
        { chars: ['出', '入', '平', '安'], blankIndex: 3, meaning: '出門同返屋企都平平安安，順順利利。', options: ['安', '康', '定', '祥'] },
        { chars: ['開', '開', '心', '心'], blankIndex: 0, meaning: '心情舒暢愉快，每日滿臉笑容。', options: ['開', '放', '歡', '喜'] },
        { chars: ['萬', '事', '勝', '意'], blankIndex: 2, meaning: '所有事情都稱心如意，比想像中更好。', options: ['勝', '如', '稱', '吉'] },
        { chars: ['長', '命', '百', '歲'], blankIndex: 1, meaning: '祝願長者長壽健康，福壽雙全。', options: ['命', '生', '年', '樂'] },
        { chars: ['福', '如', '東', '海'], blankIndex: 0, meaning: '比喻福氣如同東海之水一樣浩大無窮。', options: ['福', '壽', '吉', '春'] },
        { chars: ['壽', '比', '南', '山'], blankIndex: 0, meaning: '祝願壽命如同南山一樣長久不衰。', options: ['壽', '福', '山', '天'] },
        { chars: ['吉', '祥', '如', '意'], blankIndex: 1, meaning: '吉祥幸運，萬事都能符合心意。', options: ['祥', '星', '慶', '順'] },
        { chars: ['四', '季', '平', '安'], blankIndex: 2, meaning: '一年四季春夏秋冬都平平安安。', options: ['平', '長', '大', '順'] }
      ]
    ];

    async function fetchIdiomsXML() {
      try {
        const res = await fetch('chinesewords.xml');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const setNodes = xmlDoc.getElementsByTagName('set');
        
        const loadedSets = [];
        for (let s = 0; s < setNodes.length; s++) {
          const qNodes = setNodes[s].getElementsByTagName('question');
          const setList = [];
          for (let q = 0; q < qNodes.length; q++) {
            const text = qNodes[q].getElementsByTagName('text')[0]?.textContent || '';
            const blankIndex = parseInt(qNodes[q].getElementsByTagName('blankIndex')[0]?.textContent || '0', 10);
            const meaning = qNodes[q].getElementsByTagName('meaning')[0]?.textContent || '';
            const optNodes = qNodes[q].getElementsByTagName('option');
            const options = [];
            for (let o = 0; o < optNodes.length; o++) {
              options.push(optNodes[o].textContent.trim());
            }
            setList.push({
              chars: text.split(''),
              blankIndex: blankIndex,
              meaning: meaning,
              options: options
            });
          }
          if (setList.length > 0) loadedSets.push(setList);
        }

        if (loadedSets.length > 0) {
          idiomSets = loadedSets;
        } else {
          idiomSets = fallbackIdioms;
        }
      } catch (err) {
        console.warn('載入 chinesewords.xml 失敗，使用預設備用題庫:', err);
        idiomSets = fallbackIdioms;
      }

      initSetDropdown();
      renderIdiom();
    }

    function initSetDropdown() {
      const select = document.getElementById('set-dropdown');
      select.innerHTML = '';
      try {
        const saved = localStorage.getItem('grandma_idiom_set');
        if (saved !== null) {
          currentSetIdx = parseInt(saved, 10) || 0;
          if (currentSetIdx >= idiomSets.length) currentSetIdx = 0;
        }
      } catch (e) {}

      for (let i = 0; i < idiomSets.length; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `第 ${i + 1} 組 (題 ${i * 10 + 1}-${i * 10 + 10})`;
        if (i === currentSetIdx) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function onSelectSet(idx) {
      currentSetIdx = parseInt(idx, 10);
      currentIdiomInSet = 0;
      saveIdiomProgress();
      renderIdiom();
    }

    function saveIdiomProgress() {
      try {
        localStorage.setItem('grandma_idiom_set', currentSetIdx);
      } catch (e) {}
    }

    function renderIdiom() {
      if (!idiomSets[currentSetIdx]) return;
      const curSet = idiomSets[currentSetIdx];
      const cur = curSet[currentIdiomInSet];

      document.getElementById('idiom-progress-label').innerText = `第 ${currentSetIdx + 1} 組 ・ 第 ${currentIdiomInSet + 1} / ${curSet.length} 題`;
      document.getElementById('set-dropdown').value = currentSetIdx;
      document.getElementById('idiom-meaning').innerText = '💡 提示：' + cur.meaning;

      const displayBox = document.getElementById('idiom-display');
      displayBox.innerHTML = '';
      cur.chars.forEach((c, idx) => {
        const div = document.createElement('div');
        div.className = 'char-box' + (idx === cur.blankIndex ? ' blank' : '');
        div.innerText = idx === cur.blankIndex ? '？' : c;
        div.id = `char-pos-${idx}`;
        displayBox.appendChild(div);
      });

      const optionsBox = document.getElementById('idiom-options');
      optionsBox.innerHTML = '';
      cur.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => chooseOption(opt);
        optionsBox.appendChild(btn);
      });
    }

    function chooseOption(char) {
      const curSet = idiomSets[currentSetIdx];
      const cur = curSet[currentIdiomInSet];
      const targetChar = cur.chars[cur.blankIndex];
      const targetBox = document.getElementById(`char-pos-${cur.blankIndex}`);

      if (char === targetChar) {
        targetBox.innerText = char;
        targetBox.style.color = 'var(--secondary)';
        isLastAnswerCorrect = true;

        // 如果是本組最後一題 (第 10 題)
        if (currentIdiomInSet === curSet.length - 1) {
          playFanfare();
          setTimeout(() => {
            showSetCompletionPopup();
          }, 450);
        } else {
          playChime(true);
          // 彈出確認訊息：婆婆點確認就直接進入下一題，不需多點一次
          showFeedback("好叻呀！🎉", `答啱喇！「${cur.chars.join('')}」！`, true);
        }
      } else {
        isLastAnswerCorrect = false;
        playChime(false);
        showFeedback("差少少，再試試！🌸", `選了「${char}」，睇睇提示再諗一諗！`, false);
      }
    }

    function prevIdiom() {
      if (currentIdiomInSet > 0) {
        currentIdiomInSet--;
        renderIdiom();
      }
    }

    function nextIdiom() {
      const curSet = idiomSets[currentSetIdx];
      if (currentIdiomInSet < curSet.length - 1) {
        currentIdiomInSet++;
        renderIdiom();
      } else {
        showSetCompletionPopup();
      }
    }

    function showFeedback(title, text, isCorrect) {
      document.getElementById('fb-title').innerText = title;
      document.getElementById('fb-text').innerText = text;
      const btn = document.getElementById('fb-btn');
      if (isCorrect) {
        btn.innerText = "好！做下一題 ➡️";
        btn.style.background = "var(--secondary)";
      } else {
        btn.innerText = "再試試 🌸";
        btn.style.background = "#5A6B7C";
      }
      document.getElementById('feedback-modal').classList.add('show');
    }

    // 婆婆點確認訊息直接執行
    function onConfirmFeedback() {
      document.getElementById('feedback-modal').classList.remove('show');
      if (isLastAnswerCorrect) {
        const curSet = idiomSets[currentSetIdx];
        if (currentIdiomInSet < curSet.length - 1) {
          currentIdiomInSet++;
          renderIdiom();
        }
      }
    }

    function showSetCompletionPopup() {
      document.getElementById('set-popup-title').innerText = `太叻喇！第 ${currentSetIdx + 1} 組完成！🎉`;
      const nextIdx = currentSetIdx + 1;
      const nextBtn = document.getElementById('next-set-btn');

      if (nextIdx < idiomSets.length) {
        document.getElementById('set-popup-body').innerText = 
          `婆婆真係好精明，第 ${currentSetIdx + 1} 組 10 題成語全部順利過關！每日動動腦，越玩越精神！`;
        nextBtn.innerText = `挑戰第 ${nextIdx + 1} 組 ➡️`;
      } else {
        document.getElementById('set-popup-body').innerText = 
          `恭喜婆婆！全部成語大功告成！頭腦非常清晰靈活！`;
        nextBtn.innerText = `從第 1 組重新挑戰 🔄`;
      }

      document.getElementById('set-popup').classList.add('show');
    }

    function goToNextSet() {
      document.getElementById('set-popup').classList.remove('show');
      if (currentSetIdx < idiomSets.length - 1) {
        currentSetIdx++;
      } else {
        currentSetIdx = 0;
      }
      currentIdiomInSet = 0;
      saveIdiomProgress();
      renderIdiom();
      playChime(true);
    }

    function replayCurrentSet() {
      document.getElementById('set-popup').classList.remove('show');
      currentIdiomInSet = 0;
      renderIdiom();
    }


    /* ========================================================
       2. 數獨模組 (載入自 sudokusource.xml - 1000 題)
       ======================================================== */
    let sudokuList = [];
    let currentSudokuIdx = 0;
    let currentSudokuState = [];
    let currentSolutionState = [];
    let initialCluesState = [];
    let selectedRow = -1;
    let selectedCol = -1;

    // 備用預設數獨 (防止無網絡/本地檔案fetch問題)
    const fallbackSudoku = [
      {
        id: "1",
        clues: "630000416000300210015003000160000052",
        solution: "632451416523345216215643523164164352"
      }
    ];

    async function fetchSudokuXML() {
      try {
        const res = await fetch('sudokusource.xml');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const pNodes = xmlDoc.getElementsByTagName('puzzle');

        const loaded = [];
        for (let i = 0; i < pNodes.length; i++) {
          const id = pNodes[i].getAttribute('id') || (i + 1);
          const clues = pNodes[i].getElementsByTagName('clues')[0]?.textContent.trim() || '';
          const solution = pNodes[i].getElementsByTagName('solution')[0]?.textContent.trim() || '';
          if (clues.length === 36 && solution.length === 36) {
            loaded.push({ id, clues, solution });
          }
        }

        if (loaded.length > 0) {
          sudokuList = loaded;
        } else {
          sudokuList = fallbackSudoku;
        }
      } catch (err) {
        console.warn('載入 sudokusource.xml 失敗，使用備用題目:', err);
        sudokuList = fallbackSudoku;
      }

      initSudokuSelector();
      loadCurrentSudokuPuzzle();
    }

    function initSudokuSelector() {
      const select = document.getElementById('sudoku-select');
      select.innerHTML = '';
      try {
        const saved = localStorage.getItem('grandma_sudoku_idx');
        if (saved !== null) {
          currentSudokuIdx = parseInt(saved, 10) || 0;
          if (currentSudokuIdx >= sudokuList.length) currentSudokuIdx = 0;
        }
      } catch (e) {}

      // 為避免 1000 項下拉選單太長，建置每 10 題或整百題的跳題快速清單，亦可跳指定題
      for (let i = 0; i < sudokuList.length; i += 10) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `第 ${i + 1} - ${Math.min(i + 10, sudokuList.length)} 題`;
        if (currentSudokuIdx >= i && currentSudokuIdx < i + 10) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function onSelectSudoku(val) {
      currentSudokuIdx = parseInt(val, 10);
      saveSudokuProgress();
      loadCurrentSudokuPuzzle();
    }

    function saveSudokuProgress() {
      try {
        localStorage.setItem('grandma_sudoku_idx', currentSudokuIdx);
      } catch (e) {}
    }

    function loadCurrentSudokuPuzzle() {
      if (!sudokuList[currentSudokuIdx]) return;
      const p = sudokuList[currentSudokuIdx];

      document.getElementById('sudoku-progress-label').innerText = `第 ${currentSudokuIdx + 1} / ${sudokuList.length} 題`;
      
      // 更新下拉選單
      const sel = document.getElementById('sudoku-select');
      for (let opt of sel.options) {
        const base = parseInt(opt.value, 10);
        if (currentSudokuIdx >= base && currentSudokuIdx < base + 10) {
          opt.selected = true;
          break;
        }
      }

      // 解析 36 字元字串為 6x6 陣列
      initialCluesState = [];
      currentSudokuState = [];
      currentSolutionState = [];

      for (let r = 0; r < 6; r++) {
        const rowClue = [];
        const rowCurr = [];
        const rowSol = [];
        for (let c = 0; c < 6; c++) {
          const idx = r * 6 + c;
          const clueVal = parseInt(p.clues[idx], 10) || 0;
          const solVal = parseInt(p.solution[idx], 10) || 0;
          rowClue.push(clueVal);
          rowCurr.push(clueVal);
          rowSol.push(solVal);
        }
        initialCluesState.push(rowClue);
        currentSudokuState.push(rowCurr);
        currentSolutionState.push(rowSol);
      }

      selectedRow = -1;
      selectedCol = -1;
      renderSudokuGrid();
    }

    function renderSudokuGrid() {
      const grid = document.getElementById('sudoku-grid');
      grid.innerHTML = '';
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const val = currentSudokuState[r][c];
          const isGiven = initialCluesState[r][c] !== 0;
          const cell = document.createElement('div');
          cell.className = 'sudoku-cell' + (isGiven ? ' given' : (val !== 0 ? ' user-filled' : ''));
          if (r === selectedRow && c === selectedCol) cell.classList.add('selected');
          cell.innerText = val !== 0 ? val : '';
          cell.onclick = () => selectCell(r, c, isGiven);
          grid.appendChild(cell);
        }
      }
    }

    function selectCell(r, c, isGiven) {
      if (isGiven) {
        selectedRow = -1;
        selectedCol = -1;
      } else {
        selectedRow = r;
        selectedCol = c;
      }
      renderSudokuGrid();
    }

    function inputNumber(num) {
      if (selectedRow === -1 || selectedCol === -1) return;
      if (initialCluesState[selectedRow][selectedCol] !== 0) return;
      currentSudokuState[selectedRow][selectedCol] = num;
      playChime(true);
      renderSudokuGrid();
    }

    function resetSudoku() {
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          currentSudokuState[r][c] = initialCluesState[r][c];
        }
      }
      selectedRow = -1;
      selectedCol = -1;
      renderSudokuGrid();
    }

    function checkSudoku() {
      let isComplete = true;
      let isCorrect = true;
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          if (currentSudokuState[r][c] === 0) isComplete = false;
          if (currentSudokuState[r][c] !== currentSolutionState[r][c]) isCorrect = false;
        }
      }

      if (isCorrect && isComplete) {
        playFanfare();
        showFeedback("大功告成！🏆", "婆婆好厲害，成盤數獨完成得好工整！", false);
      } else if (!isComplete) {
        showFeedback("仲差少少空格！🌸", "仲有空格未填，慢慢填唔使急！", false);
      } else {
        showFeedback("有一兩格填錯咗！💡", "留意睇下有無行或列數字重複，再改一改！", false);
      }
    }

    function prevSudoku() {
      if (currentSudokuIdx > 0) {
        currentSudokuIdx--;
        saveSudokuProgress();
        loadCurrentSudokuPuzzle();
      }
    }

    function nextSudoku() {
      if (currentSudokuIdx < sudokuList.length - 1) {
        currentSudokuIdx++;
        saveSudokuProgress();
        loadCurrentSudokuPuzzle();
      }
    }

    function randomSudoku() {
      const rand = Math.floor(Math.random() * sudokuList.length);
      currentSudokuIdx = rand;
      saveSudokuProgress();
      loadCurrentSudokuPuzzle();
      playChime(true);
    }

    // 初始化啟動 (載入雙 XML)
    fetchIdiomsXML();
    fetchSudokuXML();
  </script>
</body>
</html>
